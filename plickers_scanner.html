function otsu(g){const h=new Array(256).fill(0);for(let i=0;i<g.length;i+=3)h[g[i]]++;let n=0,s=0;for(let i=0;i<256;i++){n+=h[i];s+=i*h[i];}
 let wb=0,sb=0,best=0,t=100;for(let i=0;i<256;i++){wb+=h[i];if(!wb)continue;const wf=n-wb;if(!wf)break;sb+=i*h[i];const d=sb/wb-(s-sb)/wf,v=wb*wf*d*d;if(v>best){best=v;t=i;}}return t;}
function hull(p){p.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];
 for(const q of p){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q);}
 for(let i=p.length-1;i>=0;i--){const q=p[i];while(up.length>1&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q);}lo.pop();up.pop();return lo.concat(up);}
const area=P=>{let s=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];s+=a[0]*b[1]-b[0]*a[1];}return s/2;};
function quad(h){h=h.slice();while(h.length>4){let bi=0,bv=1e18;for(let i=0;i<h.length;i++){const a=h[(i+h.length-1)%h.length],b=h[i],c=h[(i+1)%h.length];
 const v=Math.abs((b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]));if(v<bv){bv=v;bi=i;}}h.splice(bi,1);}return h;}
function detect(){
 const im=cx.getImageData(0,0,W,H).data,g=new Uint8Array(W*H);for(let i=0;i<W*H;i++)g[i]=(im[4*i]*77+im[4*i+1]*150+im[4*i+2]*29)>>8;
 const t=otsu(g)*0.9,lab=new Int32Array(W*H),res=[];let L=0;
 for(let s=0;s<W*H;s++){if(g[s]>=t||lab[s])continue;L++;const st=[s],pts=[];lab[s]=L;let n=0;
  while(st.length){const i=st.pop();n++;const x=i%W,y=(i/W)|0;let edge=false;
   for(const j of [x>0?i-1:-1,x<W-1?i+1:-1,y>0?i-W:-1,y<H-1?i+W:-1]){if(j<0||g[j]>=t){edge=true;continue;}if(!lab[j]){lab[j]=L;st.push(j);}}
   if(edge)pts.push([x,y]);}
  if(n<500||n>W*H/4||pts.length<12)continue;
  let q=quad(hull(pts));if(q.length<4)continue;if(area(q)<0)q.reverse();const A=area(q);if(n/A<0.5||n/A>1.1)continue;
  // 讓第一條邊是畫面上「最上面」的邊 (TL→TR)
  let bi=0,by=1e9;for(let i=0;i<4;i++){const m=(q[i][1]+q[(i+1)%4][1])/2;if(m<by){by=m;bi=i;}}q=[0,1,2,3].map(i=>q[(bi+i)%4]);
  const v=[];for(let r=0;r<5;r++)for(let c=0;c<5;c++){let sum=0;for(const du of[-.05,0,.05])for(const dv of[-.05,0,.05]){
   const u=(c+.5)/5+du,w=(r+.5)/5+dv,top=[q[0][0]+(q[1][0]-q[0][0])*u,q[0][1]+(q[1][1]-q[0][1])*u],bot=[q[3][0]+(q[2][0]-q[3][0])*u,q[3][1]+(q[2][1]-q[3][1])*u];
   const x=Math.round(top[0]+(bot[0]-top[0])*w),y=Math.round(top[1]+(bot[1]-top[1])*w);sum+=g[Math.min(H-1,Math.max(0,y))*W+Math.min(W-1,Math.max(0,x))];}v.push(sum/9);}
  const mn=Math.min(...v),mx=Math.max(...v);if(mx-mn<50)continue;const mid=(mn+mx)/2,key=v.map(a=>a<mid?1:0).join('');
  const m=MAP[key];res.push({q,id:m?m[0]:null,ans:m?TOP[m[1]]:null});}
 return res;}
